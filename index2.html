<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR.js NFT con Retícula de Feedback</title>

    <!-- A-Frame y AR.js NFT Estable -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }

      /* --- 1. PANTALLA DE CARGA --- */
      .arjs-loader {
        height: 100%; width: 100%; position: fixed; top: 0; left: 0;
        background-color: rgba(0, 0, 0, 0.9); z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; text-align: center;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid #fff;
        border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* --- 2. RETÍCULA VISUAL (El Recuadro central) --- */
      #ar-reticle {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        /* Tamaño del recuadro. Ajusta según el formato de tu cuadro real */
        width: 250px; height: 250px; 
        /* Borde inicial: Rojo y grueso para indicar "Buscando" */
        border: 5px solid rgba(255, 0, 0, 0.7); 
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        z-index: 1000; /* Por encima de la cámara */
        display: none; /* Oculto hasta que cargue la AR */
        pointer-events: none; /* No interrumpe los toques en la pantalla */
        transition: border-color 0.3s, box-shadow 0.3s; /* Animación suave de color */
      }

      /* Clase CSS que aplicaremos con JS cuando se detecte la imagen */
      #ar-reticle.detected {
        border-color: rgba(0, 255, 0, 0.8); /* Verde: "Detectado" */
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
      }

      /* Pequeño texto de instrucción debajo del recuadro */
      #ar-instruction {
        position: fixed; bottom: 15%; left: 50%; transform: translateX(-50%);
        color: white; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px;
        z-index: 1000; display: none;
      }
    </style>
  </head>

  <body>
    <!-- UI Elements -->
    <div class="arjs-loader">
      <div class="spinner"></div>
      <div>Cargando Marcador NFT...</div>
    </div>
    
    <div id="ar-reticle"></div> <!-- El recuadro -->
    <div id="ar-instruction">Enmarca la foto en el recuadro</div>

    <script>
      // Componente JS para gestionar eventos de detección y UI
      AFRAME.registerComponent('ar-controller', {
        init: function () {
          var marker = this.el;
          this.vid = document.querySelector('#ar-video');
          this.reticle = document.querySelector('#ar-reticle');

          // EVENTO: Imagen Detectada Correctamente
          marker.addEventListener('markerFound', function () {
            console.log("¡Imagen correcta detectada!");
            // 1. Cambiar recuadro a VERDE agregando la clase CSS
            if(this.reticle) this.reticle.classList.add('detected');
            
            // 2. Reproducir Video
            if (this.vid) this.vid.play();
          }.bind(this));

          // EVENTO: Se perdió la imagen de vista
          marker.addEventListener('markerLost', function () {
            console.log("Se perdió la imagen.");
            // 1. Volver recuadro a ROJO quitando la clase
            if(this.reticle) this.reticle.classList.remove('detected');
            
            // 2. Pausar Video
            if (this.vid) this.vid.pause();
          }.bind(this));
        }
      });
    </script>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <video id="ar-video" src="assets/mi-video.mp4" preload="auto" loop crossorigin="anonymous" playsinline muted></video>
      </a-assets>

      <!-- 
        REEMPLAZA LA URL COMPLETA ABAJO:
        No incluyas extensiones (.fset, etc.)
      -->
      <a-nft
        ar-controller  <!-- Enganchamos nuestro script aquí -->
        type="nft"
        url="https://mezita.github.io/Truman-AR/assets/mi-cuadro"
        smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
      >
        <!-- Objeto de video (ajusta position/scale para que calce con tu cuadro) -->
        <a-video
          src="#ar-video"
          width="300" height="175"
          position="150 0.1 -150" <!-- Z ligeramente subido (0.1) para evitar parpadeo -->
          rotation="-90 0 0"
        ></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Al terminar de cargar AR.js, mostramos la retícula
      window.addEventListener('arjs-nft-loaded', function () {
        document.querySelector('.arjs-loader').style.display = 'none';
        document.querySelector('#ar-reticle').style.display = 'block';
        document.querySelector('#ar-instruction').style.display = 'block';
      });

      // Unlock audio en móviles al primer toque
      document.body.addEventListener('click', function () {
        const v = document.querySelector('#ar-video');
        if(v) v.muted = false;
      }, { once: true });
    </script>
  </body>
</html>
